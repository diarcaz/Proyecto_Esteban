# Beta template only: operator must select persistent/backed-up service plans before client use.
# No resources are provisioned by editing this file. Never reuse the old JWT secret.
# Render Blueprint Configuration (Infrastructure as Code)
# Project: NexuStaff (Enterprise Attendance & Staffing Management)

services:
  # 1. Backend API Service (NestJS + Swagger + WebSockets)
  - type: web
    name: nexustaff-beta-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexustaff-beta-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PIN_ENCRYPTION_KEY
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d
      - key: CORS_ORIGIN
        sync: false

  # 2. Frontend Application (Next.js 14 App Router)
  - type: web
    name: nexustaff-beta-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        sync: false

  # 3. Redis Store (JWT Refresh Token Revocation & Cache)
  - type: redis
    name: nexustaff-beta-redis
    ipAllowList: []
    plan: free

databases:
  # 4. Managed PostgreSQL Database
  - name: nexustaff-beta-db
    databaseName: nexustaff_beta
    user: nexustaff_user
    plan: free
